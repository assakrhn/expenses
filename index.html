<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Financial Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>💰 My Financial Tracker</h1>
    <select id="userSelect" aria-label="Nama pengguna"></select>
    <nav class="nav" aria-label="Navigasi utama">
      <button data-view="dashboard" class="active"><span>📊</span>Dashboard</button>
      <button data-view="add"><span>➕</span>Add Transaction</button>
      <button data-view="transactions"><span>🧾</span>Transactions</button>
      <button data-view="settings"><span>⚙️</span>Settings</button>
    </nav>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section id="view-dashboard" class="view active">
      <div class="toolbar">
        <select id="dashMode" aria-label="Periode">
          <option value="current">Bulan ini</option>
          <option value="previous">Bulan lalu</option>
          <option value="specific">Pilih bulan…</option>
        </select>
        <input type="month" id="dashMonth" hidden aria-label="Pilih bulan">
      </div>
      <div class="cards">
        <article class="card income"><small>Total Income</small><strong id="sumIncome">Rp 0</strong></article>
        <article class="card expense"><small>Total Expense</small><strong id="sumExpense">Rp 0</strong></article>
        <article class="card balance"><small>Balance</small><strong id="sumBalance">Rp 0</strong></article>
        <article class="card"><small>Transaksi</small><strong id="sumCount">0</strong></article>
      </div>
      <h2>Pengeluaran per kategori</h2>
      <div id="catBars" class="panel"></div>
    </section>

    <!-- ADD TRANSACTION -->
    <section id="view-add" class="view">
      <h2>Tambah transaksi</h2>
      <form id="txForm" class="panel form" novalidate>
        <label>Tanggal <input type="date" id="fDate" required></label>
        <label>Tipe
          <select id="fType" required>
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
          </select>
        </label>
        <label>Kategori <select id="fCategory" required></select></label>
        <label>Subkategori <select id="fSub"></select></label>
        <label>Jumlah <input type="text" id="fAmount" inputmode="numeric" placeholder="Rp 50.000" autocomplete="off" required></label>
        <label>Metode pembayaran <select id="fPay" required></select></label>
        <label class="wide">Catatan <input type="text" id="fNote" maxlength="200" placeholder="Opsional"></label>
        <p id="formError" class="error" role="alert" hidden></p>
        <button type="submit" id="btnSave" class="primary wide">Simpan transaksi</button>
      </form>
    </section>

    <!-- TRANSACTIONS -->
    <section id="view-transactions" class="view">
      <h2>Riwayat transaksi</h2>
      <div class="toolbar filters">
        <input type="search" id="qSearch" placeholder="Cari kategori atau catatan…">
        <select id="qType"><option value="">Semua tipe</option><option>Income</option><option>Expense</option></select>
        <select id="qCategory"></select>
        <input type="month" id="qMonth" aria-label="Filter bulan">
        <button id="qReset" type="button">Reset</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Subcategory</th><th class="num">Amount</th><th>Payment</th><th>Note</th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view">
      <h2>Pengaturan</h2>
      <div class="panel">
        <p>Status koneksi: <strong id="connStatus">-</strong></p>
        <p class="hint">URL Apps Script diatur lewat variabel <code>GOOGLE_APPS_SCRIPT_URL</code> di <code>script.js</code>.</p>
        <button id="btnTest" class="primary" type="button">Tes koneksi &amp; muat ulang data</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="script.js"></script>
</body>
</html>
